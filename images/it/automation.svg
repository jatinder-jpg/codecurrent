<g transform="translate(548 120)"><rect width="70" height="116" rx="12" fill="#0b1f3a"/><rect x="5" y="9" width="60" height="98" rx="8" fill="#fff"/><circle cx="35" cy="34" r="14" fill="#ffd84d"/><rect x="14" y="58" width="42" height="12" rx="6" fill="#2f5bff"/><rect x="14" y="78" width="42" height="12" rx="6" fill="#c5d3f0"/></g>
