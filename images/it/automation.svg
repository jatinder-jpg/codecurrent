<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6e0"/><stop offset="1" stop-color="#dbe6fb"/></linearGradient></defs>
<rect width="640" height="480" rx="24" fill="url(#bg)"/>
<circle cx="90" cy="80" r="60" fill="#ffd84d" fill-opacity=".3"/><circle cx="560" cy="410" r="80" fill="#2f5bff" fill-opacity=".1"/>
